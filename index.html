<!-- login.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        box-sizing: border-box;
      }

      input[type="button"] {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 15px 20px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      input[type="button"]:hover {
        background-color: #45a049;
      }

      #bhandaramLink {
        display: none;
        text-decoration: none;
        color: #4caf50;
        font-weight: bold;
        margin-top: 15px;
      }

      #content {
        margin-top: 20px;
      }
    </style>

  </head>
  <body>
        <!-- FIXED: Added standard block display controls for your exact header container -->
    <div id="headerContent" style="display:none; text-align: center; width: 100%;">
      <h2 id="name" style="display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; margin: 0 auto;">
        <span>COCHIN DEVA</span>
        <img id="emblemImg" style="display:none;" width="80">
        <span>SWOM BOARD</span>
      </h2>
      <div id="mainContainer">
        <div id="devaswomName">WADAKKUNNATHAN DEVASWOM</div>
        <div id="pageNameDiv"></div>
      </div>
    </div>

  <div id="loginDiv">
    <form id="loginForm">
      Username: <input type="text" name="username" id="userName" required><br>
      Password: <input type="password" name="password" id="passWord" required><br>
      <input type="button" id="loginButton"value="Login" onclick="submitForm()">
    </form>
  </div>
    <div id="content"></div>

    <script>
      function submitForm() {
        var loginButton = document.getElementById("loginButton");
        if (loginButton) {
          loginButton.classList.add("in-progress");
          google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).doPost(document.forms.loginForm);
        } else {
          console.error("Login button not found.");
        }
      }


    function onSuccess(response) {
  // Check if the response indicates a successful login
     // var loginButton = document.getElementById("loginButton");
      //loginButton.classList.remove("in-progress");
    document.getElementById("loginButton").classList.remove("in-progress");
        if (response && response.status === 'success') {
              var group = response.group;
              var devaswom = response.devaswom;
        // Clear the input fields
           //google.script.run.setLoggedIn(true);
                // Get the username value
            var usernameValue = document.getElementById("userName").value;
            localStorage.setItem('username', usernameValue);
            localStorage.setItem('group', group);
            localStorage.setItem('devaswom', devaswom);
            document.getElementById("userName").value = "";
            document.getElementById("passWord").value = "";
            // Display the username in the index page link
            document.getElementById("loginDiv").style.display = "none";
            document.getElementById("headerContent").style.display = "block";
            createNavigationScreen(level);
      } else {
          // Display the login failure message
          alert(response.message);
        // Clear the input fields
        document.getElementById("userName").value = "";
        document.getElementById("passWord").value = "";
      }
    }
      function onFailure(error) {
        document.getElementById("loginButton").classList.remove("in-progress");
        alert(error);
      }
      // Global listener to detect clicks outside the navigation system
    document.addEventListener('click', () => {
      document.querySelectorAll('.submenu').forEach(m => {
        m.style.display = "none";
      });
    });
 function createNavigationScreen(level) {
  const tabContainer = document.createElement('div');
  tabContainer.className = 'tab';

  const navCategories = [
    { name: "neyyattam", pages: ["neyyattamEntry", 'viewNeyyattam', 'neyyattamBooking', 'neyyattamBooking-monthwise', 'neyyattamBalance', 'neyyattamPuravaka'] },
    { name: "onlineRegister", pages: ["onlineDataEntry", "onlineRegisterEntry(bulkUpload)", "viewOnlineRegister(vazhivad)", "viewOnlineRegister(pv)", "viewOnlineNeyyattam", "viewRegisters"] },
    { name: "doubleLock", pages: ["doubleReceipt"] },
    { name: "help&feedBack", pages: ["malayalamcalender", "help"] }
  ];

  // List of restricted pages for level 1 users
  const restrictedPages = ["neyyattamEntry", "onlineDataEntry", "onlineRegisterEntry(bulkUpload)","doubleReceipt"];

  navCategories.forEach(category => {
    // ✅ Filter out restricted pages if user level is 1
    let accessiblePages = category.pages;
    console.log("level",level);
    if (level == 1) {
      accessiblePages = category.pages.filter(page => !restrictedPages.includes(page));
    }
    // Skip creating the category button entirely if it has no accessible pages left
    if (accessiblePages.length === 0) return;

    const wrapper = document.createElement('div');
    wrapper.style.position = "relative";

    const tabButton = document.createElement('button');
    tabButton.className = 'tablinks';
    tabButton.textContent = category.name;

    const submenu = document.createElement('div');
    submenu.className = 'submenu';

    // ✅ Loop through filtered pages instead of the original category.pages
    accessiblePages.forEach(page => {
      const link = document.createElement('a');
      link.href = "#";
      link.textContent = page;
      link.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        submenu.style.display = "none";
        loadPage(page); 
      };
      submenu.appendChild(link);
    });

    wrapper.appendChild(tabButton);
    wrapper.appendChild(submenu);
    tabContainer.appendChild(wrapper);

    tabButton.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.submenu').forEach(m => {
        if (m !== submenu) m.style.display = "none";
      });
      submenu.style.display =
        submenu.style.display === "block" ? "none" : "block";
    };
  });

  const navPanel = document.getElementById('navPannel');
  if (navPanel) {
    navPanel.innerHTML = "";
    navPanel.appendChild(tabContainer);
  }
}
  
    </script>
  </body>
</html>
