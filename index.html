<!-- login.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        box-sizing: border-box;
      }

      input[type="button"] {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 15px 20px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      input[type="button"]:hover {
        background-color: #45a049;
      }

      #bhandaramLink {
        display: none;
        text-decoration: none;
        color: #4caf50;
        font-weight: bold;
        margin-top: 15px;
      }

      #content {
        margin-top: 20px;
      }
    </style>

  </head>
  <body>
    <form id="loginForm">
      Username: <input type="text" name="username" id="userName" required><br>
      Password: <input type="password" name="password" id="passWord" required><br>
      <input type="button" id="loginButton"value="Login" onclick="submitForm()">
      <?var url = getUrl();?>

  <a id="bhandaramLink" href='<?=url?>?page=index' style="display: none;">bhandaram</a><br><br>

    </form>
    <div id="content"></div>

    <script>
      function submitForm() {
        var loginButton = document.getElementById("loginButton");
        if (loginButton) {
          loginButton.classList.add("in-progress");
          google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).doPost(document.forms.loginForm);
        } else {
          console.error("Login button not found.");
        }
      }


    function onSuccess(response) {
  // Check if the response indicates a successful login
     // var loginButton = document.getElementById("loginButton");
      //loginButton.classList.remove("in-progress");
    document.getElementById("loginButton").classList.remove("in-progress");
        if (response && response.status === 'success') {
              var group = response.group;
              var devaswom = response.devaswom;
        // Clear the input fields
           //google.script.run.setLoggedIn(true);
                // Get the username value
            var usernameValue = document.getElementById("userName").value;
            localStorage.setItem('username', usernameValue);
            localStorage.setItem('group', group);
            localStorage.setItem('devaswom', devaswom);
            document.getElementById("userName").value = "";
            document.getElementById("passWord").value = "";
            // Display the username in the index page link
            var bhandaramLink = document.getElementById("bhandaramLink");
            bhandaramLink.href = '<?=url?>?page=index&username=' + encodeURIComponent(usernameValue);
            document.getElementById("bhandaramLink").style.display = "inline";
            // Include index content directly
          // google.script.run.withSuccessHandler(showIndexContent).showIndexPage();
      } else {
          // Display the login failure message
          alert(response.message);
        // Clear the input fields
        document.getElementById("userName").value = "";
        document.getElementById("passWord").value = "";
      }
    }
      function onFailure(error) {
        document.getElementById("loginButton").classList.remove("in-progress");
        alert(error);
      }
    function showIndexContent(content) {
    // Check if the content is not null or undefined
      if (content) {
        document.getElementById('content').innerHTML = content;
      } else {
        // Display an error message if content is not received
        alert("Error: Unable to retrieve index content.");
     }
  }
    </script>
  </body>
</html>
